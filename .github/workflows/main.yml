name: Build Kernel with SukiSU Ultra for Redmi K40s (munch)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel for munch
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Cập nhật lên v4 cho consistency

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/ldt2003/kernel-lts
          kernel-branch: main
          config: munch_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r487747

      - name: Vá SukiSU Ultra
        run: |
          cd kernel
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git suksisu
          cd suksisu
          ./patch.sh ../
          cd ../

      - name: Build lại kernel sau khi vá
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: .
          kernel-branch: main
          config: munch_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r487747

      - name: Đóng gói kernel
        run: |
          cd kernel
          zip -r kernel-munch-sukisu.zip arch/arm64/boot/Image.gz-dtb
          # Thêm các file khác (như modules) nếu cần

      - name: Tải artifact lên
        uses: actions/upload-artifact@v4  # Cập nhật lên v4
        with:
          name: kernel-munch-sukisu
          path: kernel/kernel-munch-sukisu.zip
          retention-days: 5  # Lưu artifact trong 5 ngày
